name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish under ghcr.io/<owner>/palmr:<tag> (defaults to the branch name, slashes replaced with dashes)"
        required: false
        type: string
  push:
    branches:
      - fix/folder-share-download-auth

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Manual (workflow_dispatch) runs publish under a tag derived from the input or
      # branch name, so ad-hoc test builds never clobber the `fix-folder-share-auth`
      # tag that the automatic push-trigger (and the deployed stack) relies on.
      - name: Resolve image tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.image_tag }}" ]; then
              echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=fix-folder-share-auth" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/palmr:${{ steps.vars.outputs.tag }}
          platforms: linux/amd64
